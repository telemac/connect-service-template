syntax = "proto3";

package customer.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/field_mask.proto";

option go_package = "github.com/telemac/connectrpc-v2-poc/gen/go/customer/v1;customerv1";

// CustomerService manages customers. It is the canonical example entity of
// this boilerplate: copy it when adding a new one.
service CustomerService {
  rpc CreateCustomer(CreateCustomerRequest) returns (CreateCustomerResponse) {
    option (google.api.http) = {
      post: "/v1/customers"
      body: "customer"
    };
  }

  rpc GetCustomer(GetCustomerRequest) returns (GetCustomerResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/customers/{id}"};
  }

  // ListCustomers pages through customers, filtered and sorted.
  rpc ListCustomers(ListCustomersRequest) returns (ListCustomersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/customers"};
  }

  // UpdateCustomer changes the fields listed in update_mask (AIP-134).
  rpc UpdateCustomer(UpdateCustomerRequest) returns (UpdateCustomerResponse) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = {
      patch: "/v1/customers/{id}"
      body: "customer"
    };
  }

  // DeleteCustomer removes a customer. Deleting an unknown id is NotFound.
  rpc DeleteCustomer(DeleteCustomerRequest) returns (DeleteCustomerResponse) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = {delete: "/v1/customers/{id}"};
  }
}

// Customer carries the entity's constraints; requests embed it instead of
// repeating them. Field rules apply when a field is set; whether a REQUIRED
// field must be set depends on the request (always on create, only when in
// the update mask on update), so that is enforced by the request messages.
message Customer {
  // Assigned by the server; ignored on create.
  string id = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  string name = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.max_len = 100,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  string email = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.email = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

message CreateCustomerRequest {
  option (buf.validate.message).cel = {
    id: "customer.name.required"
    message: "customer.name is required"
    expression: "this.customer.name != ''"
  };
  option (buf.validate.message).cel = {
    id: "customer.email.required"
    message: "customer.email is required"
    expression: "this.customer.email != ''"
  };

  Customer customer = 1 [(buf.validate.field).required = true];
}

message CreateCustomerResponse {
  Customer customer = 1;
}

message GetCustomerRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetCustomerResponse {
  Customer customer = 1;
}

message ListCustomersRequest {
  // Maximum number of customers to return. 0 means the server default (1000);
  // values above 10000 are coerced to 10000.
  int32 page_size = 1 [(buf.validate.field).int32.gte = 0];
  // Opaque token from a previous next_page_token. Empty for the first page.
  // Only valid with the filters and sort it was issued for.
  string page_token = 2;

  // Filters. Empty fields are ignored; set fields are combined with AND.
  // Case-insensitive substring of the name.
  string name_contains = 3 [(buf.validate.field).string.max_len = 100];
  // Case-insensitive exact email.
  string email = 4 [
    (buf.validate.field).string.email = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // Sort.
  CustomerOrder order_by = 5 [(buf.validate.field).enum.defined_only = true];
  bool descending = 6;
}

// CustomerOrder is the sort key of ListCustomers. Ties are broken by creation
// order.
enum CustomerOrder {
  // Creation order.
  CUSTOMER_ORDER_UNSPECIFIED = 0;
  // Case-insensitive name.
  CUSTOMER_ORDER_NAME = 1;
  // Case-insensitive email.
  CUSTOMER_ORDER_EMAIL = 2;
}

message ListCustomersResponse {
  repeated Customer customers = 1;
  // Empty when there are no more pages.
  string next_page_token = 2;
}

// UpdateCustomerRequest follows AIP-134. Only the fields in update_mask
// change; an omitted mask means every non-empty field of customer, and "*"
// replaces every mutable field. "id" in the mask is ignored (AIP-203). The
// target is id; a different customer.id is rejected so a client bug cannot
// silently update the wrong customer.
message UpdateCustomerRequest {
  option (buf.validate.message).cel = {
    id: "customer.id.matches_path"
    message: "customer.id must be empty or equal to id"
    expression: "!has(this.customer) || this.customer.id == '' || this.customer.id == this.id"
  };

  option (buf.validate.message).cel = {
    id: "customer.name.required_by_mask"
    message: "customer.name is required when update_mask contains name or *"
    expression: "!('name' in this.update_mask.paths || '*' in this.update_mask.paths) || this.customer.name != ''"
  };
  option (buf.validate.message).cel = {
    id: "customer.email.required_by_mask"
    message: "customer.email is required when update_mask contains email or *"
    expression: "!('email' in this.update_mask.paths || '*' in this.update_mask.paths) || this.customer.email != ''"
  };

  string id = 1 [(buf.validate.field).string.uuid = true];
  Customer customer = 2 [(buf.validate.field).required = true];
  google.protobuf.FieldMask update_mask = 3 [(buf.validate.field).field_mask = {
    in: [
      "*",
      "id",
      "name",
      "email"
    ]
  }];
}

message UpdateCustomerResponse {
  Customer customer = 1;
}

message DeleteCustomerRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteCustomerResponse {}
